<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BCH HealthLink Corporate</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://earthchie.github.io/jquery.Thailand.js/jquery.Thailand.js/dist/jquery.Thailand.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container my-5">
        <!-- Header & Logo -->
        <div class="text-center mb-4">
            <img src="https://raw.githubusercontent.com/tain-tj/BCH_MKT/refs/heads/main/BCH_2025.png" alt="Logo" class="mb-3" style="max-height: 150px;">
            <h2 id="titleMain" class="fw-bold text-primary" data-i18n="mainTitle">แบบฟอร์มแจ้งความประสงค์ตรวจสุขภาพสำหรับองค์กร</h2>
        </div>

        <!-- Language Switcher (Flag Icons) -->
        <div class="text-end mb-3">
            <img src="https://flagcdn.com/w40/th.png" class="flag-icon" title="ภาษาไทย" onclick="changeLanguage('th')">
            <img src="https://flagcdn.com/w40/gb.png" class="flag-icon" title="English" onclick="changeLanguage('en')">
            <img src="https://flagcdn.com/w40/kr.png" class="flag-icon" title="한국어" onclick="changeLanguage('ko')">
            <img src="https://flagcdn.com/w40/jp.png" class="flag-icon" title="日本語" onclick="changeLanguage('ja')">
        </div>

        <form id="healthForm" class="shadow p-4 bg-white rounded">
            
            <!-- Download Template Link -->
            <div class="mb-4 text-center">
                <a href="https://github.com/tain-tj/BCH_MKT/raw/refs/heads/main/Data.xlsx" class="btn btn-success" target="_blank" id="btnDownloadExcel">
                    <i class="fa-solid fa-file-excel"></i> <span data-i18n="downloadTemp">ดาวน์โหลด Template รายชื่อผู้ตรวจสุขภาพ (Excel)</span>
                </a>
            </div>

            <!-- 1. ข้อมูลองค์กร -->
            <h4 class="text-secondary border-bottom pb-2"><i class="fa-solid fa-building"></i> <span data-i18n="orgInfo">ข้อมูลองค์กร</span></h4>
            <div class="row g-3 mb-4">
                <div class="col-md-6"><label data-i18n="orgName">ชื่อองค์กร</label><input type="text" class="form-control" name="orgName" required></div>
                <div class="col-md-6"><label data-i18n="authName">ชื่อผู้มีอำนาจลงนาม</label><input type="text" class="form-control" name="authName" required></div>
                <div class="col-md-4"><label data-i18n="position">ตำแหน่ง</label><input type="text" class="form-control" name="position" required></div>
                <div class="col-md-4"><label data-i18n="email">อีเมล</label><input type="email" class="form-control" name="email" required></div>
                <div class="col-md-4"><label data-i18n="phone">เบอร์โทรศัพท์</label><input type="text" class="form-control" name="phone" required></div>
            </div>

            <!-- 2. ข้อมูลภาษีและที่อยู่ -->
            <h4 class="text-secondary border-bottom pb-2"><i class="fa-solid fa-file-invoice-dollar"></i> <span data-i18n="taxInfo">เอกสารประกอบการเปิดเครดิต</span></h4>
            <div class="row g-3 mb-2">
                <div class="col-md-12"><label data-i18n="taxId">เลขประจำตัวผู้เสียภาษี</label><input type="text" class="form-control" name="taxId" required></div>
                <div class="col-md-3"><label data-i18n="addressNo">เลขที่/อาคาร/ชั้น</label><input type="text" class="form-control" name="addressNo" required></div>
                <div class="col-md-3"><label data-i18n="street">ถนน</label><input type="text" class="form-control" name="street"></div>
                <div class="col-md-3"><label data-i18n="soi">ซอย</label><input type="text" class="form-control" name="soi"></div>
                <div class="col-md-3"><label data-i18n="zipcode">รหัสไปรษณีย์</label><input type="text" class="form-control" name="zipcode" id="zipcode" required></div>
                <div class="col-md-4"><label data-i18n="subdistrict">แขวง/ตำบล</label><input type="text" class="form-control" name="subdistrict" id="subdistrict" required></div>
                <div class="col-md-4"><label data-i18n="district">เขต/อำเภอ</label><input type="text" class="form-control" name="district" id="district" required></div>
                <div class="col-md-4"><label data-i18n="province">จังหวัด</label><input type="text" class="form-control" name="province" id="province" required></div>
            </div>
            <div class="row g-3 mb-4">
                <div class="col-md-6"><label class="text-muted"><i class="fa-solid fa-paperclip"></i> <span data-i18n="fileReg">สำเนาใบจดทะเบียนการค้า (ไม่บังคับ)</span></label><input type="file" class="form-control" id="fileReg"></div>
                <div class="col-md-6"><label class="text-muted"><i class="fa-solid fa-paperclip"></i> <span data-i18n="fileVat">สำเนาใบ ภ.พ.20 (ไม่บังคับ)</span></label><input type="file" class="form-control" id="fileVat"></div>
            </div>

            <!-- ... โครงสร้างฟอร์มส่วนอื่นๆ คงเดิม แต่เพิ่ม data-i18n ให้กับ label ต่างๆ (ผมรวบรัดในส่วนที่เหลือเพื่อไม่ให้รกเกินไป คุณสามารถใส่ data-i18n ลงไปใน tag ที่ต้องการแปลได้เลยตาม Dictionary ด้านล่าง) ... -->
            
            <div class="text-center mt-5">
                <button type="button" class="btn btn-primary btn-lg px-5" id="btnPreview"><i class="fa-solid fa-eye"></i> <span data-i18n="btnPreview">ตรวจสอบข้อมูล (Preview)</span></button>
            </div>
        </form>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://earthchie.github.io/jquery.Thailand.js/jquery.Thailand.js/dependencies/JQL.min.js"></script>
    <script src="https://earthchie.github.io/jquery.Thailand.js/jquery.Thailand.js/dependencies/typeahead.bundle.js"></script>
    <script src="https://earthchie.github.io/jquery.Thailand.js/jquery.Thailand.js/dist/jquery.Thailand.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
